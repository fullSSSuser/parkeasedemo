<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ParkEase — Hanoi Smart Parking</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<style>
  :root{
    --pink:#ff2e73; --pink-soft:#fff0f5; --pink-glow:rgba(255,46,115,.28);
    --ink:#12121c; --muted:#7a7f93; --line:#e9e9f0; --bg:#f7f7fb;
    --green:#1faa5f; --amber:#f0a020; --red:#e2413b;
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
  html,body{height:100%;overflow:hidden}
  body{background:var(--bg);color:var(--ink)}

  .app{display:grid;grid-template-columns:1fr 400px;height:100vh}
  @media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{display:none!important}}

  #map{height:100%;width:100%;z-index:1}
  .map-wrap{position:relative;overflow:hidden}

  .searchbar{position:absolute;top:18px;left:18px;right:18px;z-index:500;display:flex;gap:10px;align-items:center}
  .search{flex:1;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;
    display:flex;align-items:center;gap:10px;box-shadow:0 6px 24px rgba(18,18,28,.08);max-width:460px}
  .search i{color:var(--pink)}
  .search input{border:none;outline:none;flex:1;font-size:.92rem;font-weight:600;background:transparent}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .chip{background:#fff;border:1px solid var(--line);border-radius:30px;padding:8px 14px;
    font-size:.76rem;font-weight:700;color:#4a5066;cursor:pointer;display:flex;align-items:center;
    gap:6px;transition:.15s;box-shadow:0 2px 8px rgba(18,18,28,.04)}
  .chip i{font-size:.72rem;color:#8b90a3}
  .chip.active{background:var(--ink);border-color:var(--ink);color:#fff}
  .chip.active i{color:var(--pink)}

  .pin{display:flex;align-items:center;gap:6px;background:#fff;border-radius:30px;padding:7px 11px;
    font-weight:800;font-size:.74rem;color:var(--ink);white-space:nowrap;
    box-shadow:0 6px 20px rgba(18,18,28,.18);border:2px solid #fff}
  .pin .dot{width:8px;height:8px;border-radius:50%}
  .pin.green .dot{background:var(--green)}
  .pin.amber .dot{background:var(--amber)}
  .pin.red .dot{background:var(--red)}

  .sidebar{background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column;
    overflow-y:auto;padding:24px;position:relative}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:24px}
  .brand .logo{width:36px;height:36px;border-radius:10px;background:var(--pink);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:1rem;box-shadow:0 6px 18px var(--pink-glow)}
  .brand h1{font-size:1.1rem;font-weight:800;letter-spacing:-.02em}
  .brand small{display:block;font-size:.68rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}

  .panel{animation:fade .25s}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .f-name{font-size:1.3rem;font-weight:800;letter-spacing:-.02em;line-height:1.2}
  .f-addr{font-size:.8rem;color:var(--muted);margin-top:6px;display:flex;gap:6px;align-items:center;font-weight:500}
  .f-addr i{color:var(--pink);font-size:.7rem}
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:800;
    padding:6px 11px;border-radius:30px;margin-top:10px}
  .badge.green{background:#e6f8ee;color:#0f8a4b}
  .badge.amber{background:#fff3e0;color:#b06a00}
  .badge.red{background:#fdeaea;color:#c02b25}

  .stats{display:flex;gap:14px;margin:14px 0 18px;font-size:.76rem;color:#5b6076;font-weight:600;flex-wrap:wrap}
  .stats span{display:flex;align-items:center;gap:5px}
  .stats i{color:var(--pink);font-size:.72rem}

  .btn{width:100%;border:none;border-radius:14px;padding:14px;font-size:.9rem;font-weight:800;
    display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:.15s}
  .btn-primary{background:var(--pink);color:#fff;box-shadow:0 10px 24px var(--pink-glow)}
  .btn-primary:active{transform:scale(.98)}
  .btn-dark{background:var(--ink);color:#fff}
  .btn-ghost{background:var(--bg);color:#4a5066;border:1px solid var(--line)}
  .btn+.btn{margin-top:10px}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  .wheel-wrap{display:flex;align-items:center;gap:22px;background:var(--bg);
    border:1px solid var(--line);border-radius:20px;padding:18px;margin:14px 0}
  .wheel{position:relative;width:120px;height:120px;flex:0 0 auto;touch-action:none;user-select:none}
  .wheel svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
  .wheel .track{fill:none;stroke:#e4e4ee;stroke-width:11;stroke-linecap:round}
  .wheel .prog{fill:none;stroke:var(--pink);stroke-width:11;stroke-linecap:round;
    filter:drop-shadow(0 0 6px var(--pink-glow));transition:stroke-dashoffset .08s linear}
  .wheel .knob{position:absolute;width:24px;height:24px;border-radius:50%;background:#fff;
    border:5px solid var(--pink);top:50%;left:50%;margin:-12px 0 0 -12px;
    box-shadow:0 4px 14px var(--pink-glow);cursor:grab;transform-origin:center;
    transform:translate(-50%,-50%) rotate(0deg) translateY(-54px)}
  .wheel .knob:active{cursor:grabbing}
  .wheel-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;pointer-events:none}
  .wheel-center b{font-size:1.55rem;font-weight:800;line-height:1}
  .wheel-center small{font-size:.62rem;font-weight:800;color:var(--muted);
    text-transform:uppercase;letter-spacing:.08em;margin-top:3px}
  .price-box{flex:1}
  .price-box .lbl{font-size:.64rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
  .price-box .amt{font-size:1.85rem;font-weight:800;letter-spacing:-.03em;margin-top:3px;line-height:1.1}
  .price-box .amt span{font-size:.85rem;font-weight:700;color:var(--muted)}
  .price-box .tier{display:inline-flex;align-items:center;gap:5px;font-size:.68rem;
    font-weight:800;margin-top:6px;padding:4px 9px;border-radius:20px}
  .tier.off{background:#e6f8ee;color:#0f8a4b}
  .tier.peak{background:#fff3e0;color:#b06a00}

  .field{margin:10px 0}
  .field label{display:block;font-size:.66rem;font-weight:800;text-transform:uppercase;
    letter-spacing:.07em;color:var(--muted);margin-bottom:6px}
  .field input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;
    font-size:.94rem;font-weight:700;background:#fff;letter-spacing:.03em}
  .field input:focus{outline:none;border-color:var(--pink);box-shadow:0 0 0 3px var(--pink-soft)}

  .kv{display:flex;justify-content:space-between;font-size:.78rem;padding:9px 0;
    border-bottom:1px dashed var(--line);font-weight:600;color:#5b6076}
  .kv strong{color:var(--ink);font-weight:800}
  .kv.total{border-bottom:none;padding-top:12px;font-size:.92rem}
  .kv.total strong{color:var(--pink);font-size:1.05rem}

  .session-card{background:linear-gradient(135deg,#12121c 0%,#2a1030 100%);
    color:#fff;border-radius:20px;padding:18px;margin-bottom:16px}
  .session-card .lbl{font-size:.66rem;font-weight:800;text-transform:uppercase;
    letter-spacing:.08em;color:rgba(255,255,255,.6)}
  .timer{font-variant-numeric:tabular-nums;font-size:2rem;font-weight:800;
    letter-spacing:.03em;margin:4px 0 2px;color:var(--pink)}
  .session-card .meta{font-size:.76rem;color:rgba(255,255,255,.75);font-weight:600}
  .session-card .cost{font-size:1rem;font-weight:800;margin-top:8px}
  .session-actions{display:flex;gap:8px;margin-top:14px}
  .session-actions .btn{flex:1;padding:11px;font-size:.8rem;margin:0}

  .modal{position:fixed;inset:0;background:rgba(10,10,18,.55);backdrop-filter:blur(4px);
    z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px;
    opacity:0;pointer-events:none;transition:opacity .2s}
  .modal.show{opacity:1;pointer-events:auto}
  .card{background:#fff;border-radius:22px;padding:28px;max-width:420px;width:100%;
    box-shadow:0 40px 80px rgba(0,0,0,.4);transform:scale(.94);
    transition:transform .25s cubic-bezier(.2,1.2,.4,1);max-height:90vh;overflow-y:auto}
  .modal.show .card{transform:scale(1)}
  .card h3{font-size:1.2rem;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
  .card .sub{font-size:.76rem;color:var(--muted);margin-bottom:18px;font-weight:600}

  .pays{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
  .pay{display:flex;align-items:center;gap:8px;padding:12px;border-radius:12px;
    border:2px solid var(--line);background:#fff;font-size:.78rem;font-weight:800;
    color:#4a5066;cursor:pointer;justify-content:center;transition:.15s}
  .pay i{color:#9aa0b0;font-size:1rem}
  .pay.active{border-color:var(--pink);background:var(--pink-soft);color:var(--ink)}
  .pay.active i{color:var(--pink)}

  .invoice{background:#f2f6ff;border:1px dashed #6a8dff;border-radius:12px;
    padding:12px;display:flex;gap:10px;margin-bottom:14px;align-items:flex-start}
  .invoice i{color:#4a6eff;font-size:1.1rem;margin-top:2px}
  .invoice .it{flex:1;font-size:.7rem;color:#2a3a7a;font-weight:700;line-height:1.45}
  .invoice .it b{display:block;font-size:.74rem;margin-bottom:2px}
  .invoice .code{font-family:'Courier New',monospace;letter-spacing:.5px;font-size:.72rem}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
    background:var(--ink);color:#fff;font-size:.8rem;font-weight:700;padding:12px 20px;
    border-radius:30px;z-index:3000;box-shadow:0 10px 30px rgba(0,0,0,.3);
    opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}

  .hint{font-size:.72rem;color:var(--muted);font-weight:600;text-align:center;margin-top:10px}
  .divider{height:1px;background:var(--line);margin:16px 0}
  .empty{text-align:center;padding:40px 10px;color:var(--muted)}
  .empty i{font-size:2.4rem;color:#dcdce6;margin-bottom:12px;display:block}
  .empty p{font-size:.82rem;font-weight:600}
  .leaflet-control-attribution{font-size:7px!important;opacity:.6!important}
</style>
</head>
<body>

<div class="app">
  <div class="map-wrap">
    <div id="map"></div>
    <div class="searchbar">
      <div style="flex:1">
        <div class="search">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input id="searchInput" type="text" placeholder="Search parking in Hanoi…" autocomplete="off" />
        </div>
        <div class="chips" id="chips">
          <div class="chip active" data-filter="all"><i class="fa-solid fa-layer-group"></i>All</div>
          <div class="chip" data-filter="basement"><i class="fa-solid fa-building"></i>Basements</div>
          <div class="chip" data-filter="surface"><i class="fa-solid fa-square-parking"></i>Surface</div>
          <div class="chip" data-filter="ev"><i class="fa-solid fa-bolt"></i>EV</div>
          <div class="chip" data-filter="curbside"><i class="fa-solid fa-road"></i>Curbside</div>
        </div>
      </div>
    </div>
  </div>

  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><i class="fa-solid fa-parking"></i></div>
      <div>
        <h1>ParkEase</h1>
        <small>Hanoi Smart Parking</small>
      </div>
    </div>
    <div id="panel"></div>
  </aside>
</div>

<div class="modal" id="modal"><div class="card" id="modalCard"></div></div>
<div class="toast" id="toast">Saved</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ================================================================
   ParkEase — frontend (talks to Express backend)
   ================================================================ */
(function(){
'use strict';

const API = '';   // same-origin. Change to "https://your-api.onrender.com" if split.

const $ = s => document.querySelector(s);
const panelEl = document.getElementById('panel');
const modal = document.getElementById('modal');
const modalCard = document.getElementById('modalCard');
const toastEl = document.getElementById('toast');
const chipsEl = document.getElementById('chips');
const searchEl = document.getElementById('searchInput');

/* ---------- state (UI only; truth lives on server) ---------- */
const UI = {
  mode: 'browse',       // browse | facility | navigating | session | checkout
  facilityId: null,
  hours: 2,
  filter: 'all',
  search: '',
  facilities: [],
  facilitiesRaw: [],
  reservation: null,
  session: null,
  plate: '30H-987.65',
  selectedPay: 'MoMo',
  routeLine: null,
  tickTimer: null,
  peak: false,
};

/* ---------- helpers ---------- */
function toast(msg, ms=2000){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastEl._t);
  toastEl._t = setTimeout(()=>toastEl.classList.remove('show'), ms);
}
const fmtVND = n => n.toLocaleString('vi-VN') + ' VND';
const fmtDuration = h => {
  const hh = Math.floor(h), mm = Math.round((h-hh)*60);
  return `${hh}h ${String(mm).padStart(2,'0')}m`;
};
const fmtClock = ms => {
  const s = Math.max(0, Math.floor(ms/1000));
  return [Math.floor(s/3600), Math.floor(s%3600/60), s%60]
    .map(n => String(n).padStart(2,'0')).join(':');
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pinClass = f => {
  const r = f.avail / f.total;
  return r > 0.30 ? 'green' : r > 0.10 ? 'amber' : 'red';
};

/* ---------- API client ---------- */
async function api(path, opts={}){
  const res = await fetch(API + path, {
    headers: { 'Content-Type': 'application/json' },
    ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json().catch(()=>({}));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

/* ---------- map ---------- */
const map = L.map('map', { zoomControl:false }).setView([21.0285, 105.8542], 13.4);
L.tileLayer('https://basemaps.cartocdn.com/rastertiles/light_all/{z}/{x}/{y}{r}.png?key=cb1_56ze_1_6c8b9d934c75501dc76b0b1e', {
  attribution:'&copy; OSM &copy; CARTO', maxZoom:19,
}).addTo(map);

const markers = {};

async function loadFacilities(){
  try {
    const data = await api('/api/facilities');
    UI.facilitiesRaw = data.facilities;
    UI.peak = data.peak;
    UI.facilities = filterList(data.facilities);
    syncMarkers(data.facilities);
    if (UI.mode === 'browse') renderPanel();
  } catch(e){
    toast('Cannot reach backend: ' + e.message, 4000);
  }
}

function filterList(list){
  return list.filter(f=>{
    if (UI.filter === 'ev' && !f.ev) return false;
    if (UI.filter !== 'all' && UI.filter !== 'ev' && f.type !== UI.filter) return false;
    if (UI.search && !(f.name+' '+f.addr).toLowerCase().includes(UI.search.toLowerCase())) return false;
    return true;
  });
}

function syncMarkers(all){
  all.forEach(f=>{
    const cls = pinClass(f);
    const html = `<div class="pin ${cls}"><span class="dot"></span>${f.avail} / ${f.total}</div>`;
    if (markers[f.id]) {
      markers[f.id].setIcon(L.divIcon({ className:'', html, iconSize:[0,0], iconAnchor:[28,20] }));
    } else {
      const m = L.marker([f.lat, f.lng], {
        icon: L.divIcon({ className:'', html, iconSize:[0,0], iconAnchor:[28,20] }),
      }).addTo(map);
      m.on('click', ()=>selectFacility(f.id));
      markers[f.id] = m;
    }
  });
}

/* ---------- panel renderers ---------- */
function renderPanel(){
  if (UI.mode === 'browse') return renderBrowse();
  if (UI.mode === 'facility') return renderFacility();
  if (UI.mode === 'navigating') return renderNavigating();
  if (UI.mode === 'session') return renderSession();
  if (UI.mode === 'checkout') return renderCheckout();
}

function renderBrowse(){
  const list = UI.facilities;
  panelEl.innerHTML = `
    <div class="panel">
      <p style="font-size:.72rem;font-weight:800;text-transform:uppercase;
          letter-spacing:.07em;color:var(--muted);margin-bottom:12px">
        ${list.length} parking stops nearby
        ${UI.peak ? ' · <span style="color:#b06a00">peak</span>' : ' · <span style="color:#0f8a4b">off-peak</span>'}
      </p>
      ${list.length ? list.map(f=>{
        const cls = pinClass(f);
        const label = cls==='green'?'Available':cls==='amber'?'Limited':'Almost full';
        return `
          <div data-fid="${f.id}" class="stop-card" style="background:var(--bg);
              border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;
              cursor:pointer;transition:.15s">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
              <div style="flex:1;min-width:0">
                <div style="font-size:.92rem;font-weight:800">${esc(f.name)}</div>
                <div style="font-size:.72rem;color:var(--muted);margin-top:4px;font-weight:600">
                  <i class="fa-solid fa-location-dot" style="color:var(--pink);margin-right:4px"></i>${esc(f.addr)}
                </div>
              </div>
              <span class="badge ${cls}" style="margin:0;font-size:.66rem">${label}</span>
            </div>
            <div style="display:flex;gap:14px;margin-top:10px;font-size:.7rem;color:#5b6076;font-weight:600">
              <span><i class="fa-solid fa-car" style="color:var(--pink)"></i> ${f.avail} free</span>
              <span><i class="fa-solid fa-tag" style="color:var(--pink)"></i> from ${fmtVND(Math.round(f.rate*0.7))}/hr</span>
              ${f.ev ? '<span><i class="fa-solid fa-bolt" style="color:var(--pink)"></i> EV</span>' : ''}
            </div>
          </div>`;
      }).join('') : `<div class="empty"><i class="fa-solid fa-parking"></i><p>No stops match your filter.</p></div>`}
    </div>`;
  panelEl.querySelectorAll('.stop-card').forEach(el=>{
    el.addEventListener('click', ()=>selectFacility(el.dataset.fid));
  });
}

function renderFacility(){
  const f = UI.facilitiesRaw.find(x=>x.id===UI.facilityId);
  if (!f) { UI.mode='browse'; return renderBrowse(); }
  const cls = pinClass(f);
  const label = cls==='green'?'Available':cls==='amber'?'Limited':'Almost full';
  panelEl.innerHTML = `
    <div class="panel">
      <button class="btn btn-ghost" data-act="back" style="margin-bottom:16px;font-size:.82rem;padding:10px">
        <i class="fa-solid fa-arrow-left"></i> Back to map
      </button>
      <div class="f-name">${esc(f.name)}</div>
      <div class="f-addr"><i class="fa-solid fa-location-dot"></i>${esc(f.addr)}</div>
      <span class="badge ${cls}"><i class="fa-solid fa-circle" style="font-size:6px"></i>${label} · ${f.avail}/${f.total} bays</span>

      <div class="stats">
        <span><i class="fa-solid fa-clock"></i>${f.hours}</span>
        <span><i class="fa-solid fa-car"></i>${f.total} bays</span>
        ${f.ev ? '<span><i class="fa-solid fa-bolt"></i>EV charging</span>' : ''}
      </div>

      <div class="wheel-wrap">
        <div class="wheel" id="wheel">
          <svg viewBox="0 0 100 100">
            <circle class="track" cx="50" cy="50" r="42"></circle>
            <circle class="prog" id="wheelProg" cx="50" cy="50" r="42"></circle>
          </svg>
          <div class="knob" id="wheelKnob"></div>
          <div class="wheel-center"><b id="wheelVal">${UI.hours}</b><small>HRS</small></div>
        </div>
        <div class="price-box">
          <div class="lbl">Estimated total</div>
          <div class="amt" id="amtBox">…</div>
          <div class="tier off" id="tierBox">…</div>
        </div>
      </div>

      <div class="field">
        <label><i class="fa-solid fa-car" style="color:var(--pink)"></i> Your license plate</label>
        <input id="plateInput" type="text" value="${esc(UI.plate)}" maxlength="12" autocomplete="off" />
        <p class="hint" style="margin-top:6px">Used for gate check-in. Format: 30H-987.65</p>
      </div>

      <div class="kv"><span><i class="fa-solid fa-shield-halved" style="color:var(--pink);margin-right:6px"></i>Hold deposit (50%)</span><strong id="depBox">—</strong></div>
      <div class="kv total"><span>Net extra booking fee</span><strong style="color:var(--green)">0 VND</strong></div>

      <div class="divider"></div>
      <button class="btn btn-primary" data-act="reserve"><i class="fa-solid fa-lock"></i>Reserve this bay</button>
      <button class="btn btn-dark" data-act="walkin" style="margin-top:10px">
        <i class="fa-solid fa-person-walking"></i>Walk in (no reservation)
      </button>
      <p class="hint">Hold for 30 min · convert to active session on arrival</p>
    </div>`;

  wireWheel(f);
  panelEl.querySelector('[data-act="back"]').addEventListener('click', ()=>goBrowse());
  panelEl.querySelector('[data-act="reserve"]').addEventListener('click', ()=>doReserve(f));
  panelEl.querySelector('[data-act="walkin"]').addEventListener('click', ()=>doWalkIn(f));
}

function wireWheel(f){
  const wheel = $('#wheel'), prog = $('#wheelProg'), knob = $('#wheelKnob');
  const valEl = $('#wheelVal'), amtEl = $('#amtBox'), tierEl = $('#tierBox'), depEl = $('#depBox');
  const R = 42, C = 2 * Math.PI * R;
  prog.style.strokeDasharray = C;
  const MIN = 0.5, MAX = 8;
  let dragging = false;

  async function refresh(){
    try {
      const q = await api(`/api/quote?facilityId=${f.id}&hours=${UI.hours}`);
      amtEl.innerHTML = q.total.toLocaleString('vi-VN') + '<span> VND</span>';
      depEl.textContent = fmtVND(q.deposit);
      tierEl.className = 'tier ' + (q.peak ? 'peak' : 'off');
      tierEl.innerHTML = `<i class="fa-solid fa-arrow-${q.peak?'up':'down'}"></i> ${q.peak ? 'Peak 1.5×' : 'Off-peak −30%'}`;
    } catch(e){ /* ignore */ }
  }

  function setHours(h){
    UI.hours = Math.max(MIN, Math.min(MAX, h));
    const p = (UI.hours - MIN) / (MAX - MIN);
    prog.style.strokeDashoffset = C * (1 - p);
    knob.style.transform = `translate(-50%,-50%) rotate(${p*360}deg) translateY(-54px)`;
    valEl.textContent = UI.hours;
    refresh();
  }

  function angle(e){
    const r = wheel.getBoundingClientRect();
    const cx = r.left + r.width/2, cy = r.top + r.height/2;
    let a = Math.atan2(e.clientY - cy, e.clientX - cx) * 180/Math.PI + 90;
    if (a < 0) a += 360;
    return a;
  }
  function onMove(e){
    if (!dragging) return;
    const a = angle(e.touches ? e.touches[0] : e);
    setHours(Math.round((MIN + (a/360)*(MAX-MIN)) * 2) / 2);
  }
  function start(e){ e.preventDefault(); dragging = true; document.body.style.userSelect='none';
    window.addEventListener('pointermove', onMove); window.addEventListener('pointerup', end); onMove(e); }
  function end(){ dragging = false; document.body.style.userSelect='';
    window.removeEventListener('pointermove', onMove); window.removeEventListener('pointerup', end); }
  wheel.addEventListener('pointerdown', start);

  setHours(UI.hours);
}

function renderNavigating(){
  const f = UI.facilitiesRaw.find(x=>x.id===UI.facilityId);
  if (!f) { UI.mode='browse'; return renderBrowse(); }
  const res = UI.reservation;
  panelEl.innerHTML = `
    <div class="panel">
      <div style="background:linear-gradient(135deg,#12121c,#2a1030);color:#fff;
          border-radius:18px;padding:18px;margin-bottom:16px">
        <div style="font-size:.64rem;font-weight:800;text-transform:uppercase;
            letter-spacing:.08em;color:rgba(255,255,255,.6)">Heading to</div>
        <div style="font-size:1.1rem;font-weight:800;margin-top:4px">${esc(f.name)}</div>
        <div style="font-size:.74rem;color:rgba(255,255,255,.7);margin-top:4px;font-weight:600">
          <i class="fa-solid fa-location-dot" style="color:var(--pink);margin-right:4px"></i>${esc(f.addr)}
        </div>
        ${res ? `<div style="margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.15);
            display:flex;justify-content:space-between;font-size:.74rem;font-weight:700">
            <span>Bay held · ${res.hours}h</span>
            <span style="color:var(--pink)">${fmtVND(res.deposit)} deposit</span>
          </div>` : ''}
      </div>

      <div class="field">
        <label><i class="fa-solid fa-car" style="color:var(--pink)"></i> Confirm plate for gate check-in</label>
        <input id="checkinPlate" type="text" value="${esc(UI.plate)}" maxlength="12" autocomplete="off" />
      </div>

      <button class="btn btn-primary" data-act="checkin">
        <i class="fa-solid fa-right-to-bracket"></i>Check in at gate
      </button>
      <button class="btn btn-ghost" data-act="back" style="margin-top:10px">
        <i class="fa-solid fa-arrow-left"></i>Back
      </button>
    </div>`;

  panelEl.querySelector('[data-act="back"]').addEventListener('click', ()=>goBrowse());
  panelEl.querySelector('[data-act="checkin"]').addEventListener('click', ()=>{
    const p = $('#checkinPlate').value.trim();
    if (!p) return toast('Enter a plate');
    UI.plate = p;
    doCheckIn();
  });
}

function renderSession(){
  const s = UI.session;
  if (!s) { UI.mode='browse'; return renderBrowse(); }
  panelEl.innerHTML = `
    <div class="panel">
      <div class="session-card">
        <div class="lbl">Active parking session</div>
        <div class="timer" id="liveTimer">00:00:00</div>
        <div class="meta">Bay <b style="color:#fff">${esc(s.bay)}</b> · ${esc(s.plate)}</div>
        <div class="cost" id="liveCost">—</div>
        <div class="session-actions">
          <button class="btn btn-ghost" data-act="extend" style="background:rgba(255,255,255,.1);color:#fff;border:none">
            <i class="fa-solid fa-plus"></i>+30 min
          </button>
          <button class="btn btn-primary" data-act="checkout"><i class="fa-solid fa-receipt"></i>Checkout</button>
        </div>
      </div>
      <div class="kv"><span>Facility</span><strong style="text-align:right;max-width:60%">${esc(s.facilityName)}</strong></div>
      <div class="kv"><span>Plate</span><strong>${esc(s.plate)}</strong></div>
      <div class="kv"><span>Deposit credit</span><strong>${fmtVND(s.deposit)}</strong></div>
      <div class="kv"><span>Extended</span><strong>${fmtDuration(s.extendedMs/3600000)}</strong></div>
    </div>`;

  panelEl.querySelector('[data-act="extend"]').addEventListener('click', async ()=>{
    try {
      UI.session = await api(`/api/sessions/${UI.session.id}/extend`, {
        method:'POST', body:{ minutes:30 },
      });
      toast('+30 min added');
      renderSession();
    } catch(e){ toast(e.message); }
  });
  panelEl.querySelector('[data-act="checkout"]').addEventListener('click', ()=>openCheckout());

  startTicker();
}

function renderCheckout(){
  const s = UI.session;
  if (!s) { UI.mode='browse'; return renderBrowse(); }
  const elapsedMs = Date.now() - s.startTs + s.extendedMs;
  const elapsedHours = Math.max(0.5, elapsedMs / 3_600_000);
  // preview (server is source of truth on submit)
  panelEl.innerHTML = `
    <div class="panel">
      <button class="btn btn-ghost" data-act="back" style="margin-bottom:16px;font-size:.82rem;padding:10px">
        <i class="fa-solid fa-arrow-left"></i>Back to session
      </button>
      <h2 style="font-size:1.15rem;font-weight:800;letter-spacing:-.02em;margin-bottom:4px">Checkout</h2>
      <p class="hint" style="text-align:left;margin:0 0 16px">Decree 123/2020/NĐ-CP e-invoice auto-issued on payment.</p>

      <div class="kv"><span>Duration</span><strong>${fmtDuration(elapsedHours)}</strong></div>
      <div class="kv"><span>Deposit credit</span><strong>−${fmtVND(s.deposit)}</strong></div>

      <div class="divider"></div>
      <div style="font-size:.72rem;font-weight:800;text-transform:uppercase;
          letter-spacing:.07em;color:var(--muted);margin-bottom:10px">Pay with</div>
      <div class="pays" id="pays">
        ${['MoMo','VietQR','ZaloPay','VETC'].map(p=>`
          <div class="pay ${p===UI.selectedPay?'active':''}" data-pay="${p}">
            <i class="fa-solid ${
              p==='MoMo'?'fa-wallet':
              p==='VietQR'?'fa-qrcode':
              p==='ZaloPay'?'fa-mobile-screen':'fa-road'
            }"></i>${p}
          </div>`).join('')}
      </div>

      <button class="btn btn-primary" data-act="pay">
        <i class="fa-solid fa-lock"></i>Pay & get invoice
      </button>
      <p class="hint">Total is computed server-side at the moment of payment.</p>
    </div>`;

  panelEl.querySelectorAll('[data-pay]').forEach(el=>{
    el.addEventListener('click', ()=>{
      UI.selectedPay = el.dataset.pay;
      panelEl.querySelectorAll('.pay').forEach(x=>x.classList.remove('active'));
      el.classList.add('active');
    });
  });
  panelEl.querySelector('[data-act="back"]').addEventListener('click', ()=>{
    stopTicker(); UI.mode='session'; renderPanel();
  });
  panelEl.querySelector('[data-act="pay"]').addEventListener('click', doPay);
}

/* ---------- actions ---------- */
function selectFacility(id){
  const f = UI.facilitiesRaw.find(x=>x.id===id);
  if (!f) return;
  UI.facilityId = id;
  UI.mode = 'facility';
  map.flyTo([f.lat, f.lng], 15.5, { duration:.7 });
  renderPanel();
}
function goBrowse(){
  UI.mode = 'browse';
  UI.facilityId = null;
  if (UI.routeLine){ map.removeLayer(UI.routeLine); UI.routeLine = null; }
  map.flyTo([21.0285,105.8542], 13.4, { duration:.6 });
  renderPanel();
}

async function doReserve(f){
  try {
    toast('Holding bay…', 1000);
    const res = await api('/api/reservations', {
      method:'POST',
      body: { facilityId: f.id, hours: UI.hours, plate: UI.plate },
    });
    UI.reservation = res;
    toast('Bay held for 30 min');
    startNavigation(f);
  } catch(e){
    toast(e.message, 3000);
  }
}
async function doWalkIn(f){
  try {
    // walk-in: create a short hold and immediately convert
    toast('Setting up walk-in…', 900);
    const res = await api('/api/reservations', {
      method:'POST',
      body: { facilityId: f.id, hours: UI.hours, plate: UI.plate },
    });
    UI.reservation = res;
    doCheckIn();
  } catch(e){ toast(e.message, 3000); }
}

function startNavigation(f){
  UI.mode = 'navigating';
  UI.facilityId = f.id;
  renderPanel();
  if (UI.routeLine){ map.removeLayer(UI.routeLine); UI.routeLine = null; }
  const start = [f.lat - 0.012, f.lng - 0.010];
  const line = L.polyline([start, [f.lat, f.lng]], {
    color:'#ff2e73', weight:5, opacity:.85, dashArray:'10 8',
  }).addTo(map);
  UI.routeLine = line;
  map.fitBounds(line.getBounds(), { padding:[60,60] });
}

async function doCheckIn(){
  try {
    if (!UI.reservation) throw new Error('No reservation');
    toast('Opening gate…', 1000);
    const session = await api('/api/sessions', {
      method:'POST', body:{ reservationId: UI.reservation.id },
    });
    UI.session = session;
    if (UI.routeLine){ map.removeLayer(UI.routeLine); UI.routeLine = null; }
    toast('Session started · Bay ' + session.bay);
    UI.mode = 'session';
    renderPanel();
  } catch(e){ toast(e.message, 3000); }
}

function openCheckout(){
  stopTicker();
  UI.mode = 'checkout';
  renderPanel();
}

async function doPay(){
  try {
    toast('Processing…', 1200);
    const { invoice } = await api(`/api/sessions/${UI.session.id}/checkout`, {
      method:'POST', body:{ method: UI.selectedPay },
    });
    UI.session = null;
    UI.reservation = null;

    modalCard.innerHTML = `
      <h3>Payment successful</h3>
      <div class="sub">Decree 123/2020/NĐ-CP e-invoice issued</div>
      <div class="kv"><span>Duration</span><strong>${fmtDuration(invoice.elapsedHours)}</strong></div>
      <div class="kv"><span>Total</span><strong>${fmtVND(invoice.total)}</strong></div>
      <div class="kv"><span>Deposit credit</span><strong>−${fmtVND(invoice.deposit)}</strong></div>
      <div class="kv total"><span>Charged via ${esc(invoice.method)}</span><strong>${fmtVND(invoice.final)}</strong></div>
      <div class="invoice" style="margin-top:16px">
        <i class="fa-solid fa-file-invoice"></i>
        <div class="it">
          <b>Mã tra cứu của Cơ quan Thuế</b>
          <span class="code">${esc(invoice.lookupCode)}</span>
        </div>
        <i class="fa-solid fa-circle-check" style="color:var(--green);margin-top:2px"></i>
      </div>
      <button class="btn btn-primary" id="doneBtn">Done</button>
      <p class="hint" style="margin-top:10px">Invoice saved on server · lookup via /api/invoices/${esc(invoice.lookupCode)}</p>
    `;
    modal.classList.add('show');
    document.getElementById('doneBtn').addEventListener('click', ()=>{
      modal.classList.remove('show');
      UI.mode = 'browse';
      UI.facilityId = null;
      loadFacilities();
    });
  } catch(e){ toast(e.message, 3000); }
}

/* ticker */
function startTicker(){
  stopTicker();
  if (!UI.session) return;
  UI.tickTimer = setInterval(()=>{
    const el = document.getElementById('liveTimer');
    const c = document.getElementById('liveCost');
    if (!el || !UI.session) return stopTicker();
    const s = UI.session;
    const ms = Date.now() - s.startTs + s.extendedMs;
    el.textContent = fmtClock(ms);
    if (c){
      const hours = Math.max(0.5, ms/3_600_000);
      // client-side preview only
      const rate = s.rate, cap = s.cap;
      const mult = UI.peak ? 1.5 : 0.7;
      const total = Math.min(Math.round(hours*rate*mult), cap);
      c.textContent = fmtVND(Math.max(0, total - s.deposit)) + ' due';
    }
  }, 500);
}
function stopTicker(){ if (UI.tickTimer){ clearInterval(UI.tickTimer); UI.tickTimer = null; } }

/* ---------- wiring ---------- */
chipsEl.addEventListener('click', e=>{
  const c = e.target.closest('.chip');
  if (!c) return;
  chipsEl.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
  c.classList.add('active');
  UI.filter = c.dataset.filter;
  UI.facilities = filterList(UI.facilitiesRaw);
  if (UI.mode === 'browse') renderPanel();
});
searchEl.addEventListener('input', ()=>{
  UI.search = searchEl.value.trim();
  UI.facilities = filterList(UI.facilitiesRaw);
  if (UI.mode === 'browse') renderPanel();
});

/* boot */
loadFacilities();
setInterval(loadFacilities, 30_000);   // refresh availability every 30s
})();
</script>
